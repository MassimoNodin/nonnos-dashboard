<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nonno's Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="today" id="today"></p>
      <p class="clock" id="clock"></p>
    </div>
    <h1>Nonno's Games</h1>
  </header>

  <main id="teams" class="teams" aria-live="polite">
    <p class="loading">Loading the games…</p>
  </main>

  <footer class="foot">
    <p id="status"></p>
    <p>Times are shown in this device's time zone (<span id="zone"></span>). Times come from Fixture Download and can change, so check closer to the day.</p>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
